# NEXpay – App bei jedem Push auf main zu Cloudflare veröffentlichen
#
# Einmalig nötig (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   – Cloudflare → My Profile → API Tokens → Create Token → Vorlage „Edit Cloudflare Workers“
#   CLOUDFLARE_ACCOUNT_ID  – Cloudflare-Dashboard → Kontoübersicht (rechte Spalte „Account ID“)
# Ohne diese Secrets wird die Veröffentlichung mit einem Hinweis übersprungen (kein Fehler).
name: App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skripte prüfen
        run: |
          node --check public/app.js
          node --check public/sw.js
          node --check public/config.js

      - name: Zugangsdaten prüfen
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning title=Cloudflare nicht verbunden::Die Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen (Settings → Secrets and variables → Actions). Veröffentlichung übersprungen."

      - name: Zu Cloudflare veröffentlichen
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: deploy
